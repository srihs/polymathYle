{% extends 'auth/auth_layout.html' %}

{% block title %}Login{% endblock %}

{% block card %}
<h4 class="login-title">Welcome Back !</h4>
<p class="login-subtitle">Sign in to continue to Polymath School of English.</p>

<form method="post" action="{% url 'login' %}">
    {% csrf_token %}

    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autofocus>
    </div>

    <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center">
            <label for="password" class="form-label">Password</label>
            <a href="{% url 'password_reset' %}" class="small text-muted mb-2">Forgot password?</a>
        </div>
        <div class="password-field-wrapper">
            <input type="password" class="form-control" name="password" id="password" placeholder="Enter password" required>
            <i class="mdi mdi-eye-outline password-toggle"></i>
        </div>
    </div>

    <button class="btn btn-login" type="submit">Sign In</button>
</form>
{% endblock %}
