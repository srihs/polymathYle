{% extends 'auth/auth_layout.html' %}

{% block title %}Password Reset{% endblock %}

{% block card %}
<div class="text-center">
    <i class="mdi mdi-check-circle-outline text-success" style="font-size: 3.5rem;"></i>
    <h4 class="login-title mt-2">Password Reset</h4>
    <p class="login-subtitle">Your password has been changed. You can now sign in with your new password.</p>
</div>

<a href="{% url 'login' %}" class="btn btn-login mt-2">Sign In</a>
{% endblock %}
